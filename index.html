<style>
/* Mevcut tasarımı BOZMAZ.
   Sadece Auto Tour sırasında aktif fotoğrafı ve aktif alanı hafif öne çıkarır. */

.thumb {
  transition:
    transform .55s cubic-bezier(.2,.8,.2,1),
    box-shadow .55s ease,
    border-color .55s ease !important;
  transform-origin:center center;
}

.thumb:hover {
  transform:scale(1.025);
  z-index:4;
}

body.autoplaying .thumb.active {
  transform:scale(1.055);
  z-index:5;
  border-color:rgba(215,187,133,.75) !important;
  box-shadow:
    0 18px 45px rgba(0,0,0,.35),
    0 0 0 1px rgba(215,187,133,.18);
}

body.autoplaying .sceneCard.active {
  transform:translateY(-2px) scale(1.012);
  box-shadow:0 14px 35px rgba(0,0,0,.22);
}

.sceneCard {
  transition:
    transform .5s cubic-bezier(.2,.8,.2,1),
    box-shadow .5s ease !important;
}
</style>

        "farklı hikâyelere dönüşebiliyor.",
      tags: ["Nikah", "Event", "Açık Hava"],

  SCENES.forEach(scene => {
    const patch = SAFE_SCENES[scene.slug];
    if (!patch) return;
    Object.assign(scene, patch);
  });

  /* Eğer kaldırdığımız fotoğraf açık durumdaysa Frame 1'e dön */
  if (state.scene >= SCENES.length) state.scene = 0;

  if (state.frame >= SCENES[state.scene].frames.length) {
    state.frame = 0;
  }

  /* Mevcut tasarımı yeniden çiz */
  render();
